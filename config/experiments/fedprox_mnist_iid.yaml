data:
  name: mnist
  num_clients: 10
  partition_type: iid
  batch_size: 64

model:
  name: mlp
  num_classes: 10

federated:
  num_rounds: 50
  fraction_fit: 0.5
  fraction_evaluate: 0.2
  local_epochs: 5
  strategy: fedprox
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_nodes: 10
  server_learning_rate: 0.1
  proximal_mu: 0.1

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

privacy:
  enabled: true
  mechanism: gaussian
  update_clip_norm: 1.0
  delta: 1e-5
  accountant: rdp
  total_budget: 500.0

personalization:
  enabled: true
  strategy: data_proportional
  epsilon_min: 0.5
  epsilon_max: 10.0
  client_epsilon_map: {}
  track_cumulative: true

logging:
  tracker: mlflow
  experiment_name: pldp-bo
  run_name: fedprox-mnist-iid-dp
  tracking_uri: sqlite:///./mlflow.db
  group: mnist_iid

seed: 42
deterministic: false

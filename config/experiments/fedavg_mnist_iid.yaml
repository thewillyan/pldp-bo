data:
  name: mnist
  num_clients: 10
  partition_type: iid
  batch_size: 64

model:
  name: mlp
  num_classes: 10

federated:
  num_rounds: 50
  fraction_fit: 0.5
  fraction_evaluate: 0.2
  local_epochs: 5
  strategy: fedavg
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_nodes: 10

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

privacy:
  enabled: true
  mechanism: gaussian
  noise_multiplier: 1.0
  max_grad_norm: 1.0
  delta: 1e-5
  accountant: rdp
  total_budget: 10.0

personalization:
  enabled: true
  strategy: uniform
  epsilon_min: 0.1
  epsilon_max: 10.0
  client_epsilon_map: {}
  track_cumulative: true

logging:
  tracker: mlflow
  experiment_name: pldp-bo
  run_name: mnist-iid-uniform-dp
  tracking_uri: sqlite:///./mlflow.db

seed: 42
deterministic: false

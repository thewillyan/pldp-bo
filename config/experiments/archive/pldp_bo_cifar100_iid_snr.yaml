data:
  name: cifar100
  num_clients: 8
  partition_type: iid
  batch_size: 64

model:
  name: cnn
  num_classes: 100

federated:
  num_rounds: 150
  fraction_fit: 0.5
  fraction_evaluate: 0.2
  local_epochs: 5
  strategy: pldp_bo
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_nodes: 8
  server_learning_rate: 0.1

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0
  gradient_clip_norm: 1.0

privacy:
  enabled: true
  mechanism: gaussian
  update_clip_norm: 5.0
  delta: 1e-5
  accountant: rdp
  total_budget: 6000.0

personalization:
  enabled: true
  strategy: data_proportional
  client_epsilon_map: {}
  track_cumulative: true

bo:
  enabled: true
  optimization_metric: snr
  bounds_strategy: from_epsilon
  bounds_ratio_min: 0.5
  bounds_ratio_max: 6.0
  max_warmup_ratio: 0.4
  min_warmup: 10
  acquisition_penalty: 0.1
  budget_margin: 0.0
  observation_noise: 0.05

logging:
  tracker: mlflow
  experiment_name: pldp-bo
  run_name: pldp-bo-cifar100-iid-snr
  tracking_uri: sqlite:///./mlflow.db
  group: cifar100_iid

seed: 42
deterministic: false

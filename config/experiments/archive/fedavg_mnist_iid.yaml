data:
  name: mnist
  num_clients: 8
  partition_type: iid
  batch_size: 64

model:
  name: mlp
  num_classes: 10

federated:
  num_rounds: 15
  fraction_fit: 0.6
  fraction_evaluate: 0.2
  local_epochs: 1
  strategy: fedavg
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_nodes: 8
  server_learning_rate: 0.5

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.0
  weight_decay: 0.001
  gradient_clip_norm: 3.0

privacy:
  enabled: true
  mechanism: gaussian
  clipping_mode: per_example
  update_clip_norm: 5.0
  delta: 1e-5
  accountant: rdp
  accountant_mode: rdp_native
  rdp_alpha: 10.0
  total_budget: 200.0

personalization:
  enabled: true
  strategy: data_proportional
  client_epsilon_map: {}
  track_cumulative: true

logging:
  tracker: mlflow
  experiment_name: pldp-bo
  run_name: fedavg-mnist-iid-dp
  tracking_uri: sqlite:///./mlflow.db
  group: mnist_iid

seed: 42
deterministic: false

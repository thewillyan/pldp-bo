data:
  name: cifar100
  num_clients: 10
  partition_type: iid
  batch_size: 64

model:
  name: cnn
  num_classes: 100

federated:
  num_rounds: 100
  fraction_fit: 0.5
  fraction_evaluate: 0.2
  local_epochs: 5
  strategy: pldp_bo
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_nodes: 10

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

privacy:
  enabled: true
  mechanism: gaussian
  update_clip_norm: 1.0
  delta: 1e-5
  accountant: rdp
  total_budget: 10.0

personalization:
  enabled: true
  strategy: data_proportional
  epsilon_min: 0.1
  epsilon_max: 10.0
  epsilon_base: 5.0
  client_epsilon_map: {}
  track_cumulative: true

bo:
  enabled: true
  epsilon_budget: 10.0
  optimization_metric: utility
  bounds_strategy: from_epsilon
  bounds_ratio_min: 0.01
  bounds_ratio_max: 0.2
  warmup_rounds: 20

logging:
  tracker: mlflow
  experiment_name: pldp-bo
  run_name: cifar100-iid-pldp-bo-personalized-utility
  tracking_uri: sqlite:///./mlflow.db

seed: 42
deterministic: false

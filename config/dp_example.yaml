# Noisy training example (no privacy budget enforcement)
data:
  name: cifar10
  num_clients: 10

model:
  name: cnn

federated:
  num_rounds: 50
  fraction_fit: 0.5
  local_epochs: 5
  strategy: fedavg

privacy:
  enabled: true
  mechanism: gaussian
  update_clip_norm: 1.0
  delta: 1e-5
  accountant: rdp

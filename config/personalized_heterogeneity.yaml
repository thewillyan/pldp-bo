data:
  name: cifar10
  num_clients: 10
  partition_type: noniid
  partition_alpha: 0.5
  batch_size: 64

model:
  name: cnn
  num_classes: 10

federated:
  num_rounds: 50
  fraction_fit: 0.5
  fraction_evaluate: 0.2
  local_epochs: 5
  strategy: fedavg
  min_fit_clients: 2
  min_evaluate_clients: 2
#  min_available_nodes: 10

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

privacy:
  enabled: true
  mechanism: gaussian
  update_clip_norm: 1.0
  delta: 1e-5
  accountant: rdp
  total_budget: 10.0

personalization:
  enabled: true
  strategy: heterogeneity
  epsilon_min: 0.5
  epsilon_max: 10.0
  client_epsilon_map: {}
  track_cumulative: true

logging:
  tracker: mlflow
  experiment_name: pldp-bo
  run_name: personalized-heterogeneity
  tracking_uri: sqlite:///./mlflow.db

seed: 42

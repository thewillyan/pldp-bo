[project]
name = "pldp-bo"
version = "0.1.0"
description = "Federated Learning with Differential Privacy experiments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flwr[simulation]>=1.32.1",
    "matplotlib",
    "mlflow>=3.14.0",
    "numpy>=2.5.0",
    "pyyaml>=6.0.3",
    "scikit-learn",
    "scipy>=1.18.0",
    "seaborn",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]

[project.license]
file = "LICENSE"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ARG", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "pldp-bo"
fab-format-version = 1
flwr-version-target = "1.32.1"

[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"

[tool.flwr.app.config]
config-path = "config/default.yaml"
app_config_overrides = "{}"

[tool.flwr.app.config.data]
num_clients = 10

[tool.flwr.app.config.federated]
min_available_nodes = 10

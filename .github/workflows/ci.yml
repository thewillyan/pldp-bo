name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check src tests scripts
      - name: Typecheck (mypy)
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest tests/ -q